<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vulnerable Customer Explainer — OmniHub</title>
  <meta name="theme-color" content="#143665" />
  <meta name="description" content="Explainer on identifying and supporting vulnerable customers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#143665; --deep:#0e274a; --steel:#4a7fb5; --mist:#d7e2ee; --paper:#f3f0e8; --ink:#122033; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Source Sans 3", system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100dvh; line-height: 1.5; }
    header { background: var(--navy); color: var(--paper); padding: 16px 0; border-bottom: 1px solid color-mix(in oklab, white 10%, transparent); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .top a { color: var(--mist); text-decoration: none; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; }
    .tool-name { font-family: Fraunces, serif; font-size: clamp(1.2rem, 2vw, 1.5rem); }
    main { padding: 40px 0 80px; }
    .kicker { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--steel); margin-bottom: 8px; }
    h1 { font-family: Fraunces, serif; font-weight: 500; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; margin-bottom: 16px; max-width: 20ch; }
    .lede { max-width: 60ch; color: #5c6b7d; margin-bottom: 32px; font-size: 1.05rem; }
    .video-wrap { position: relative; width: 100%; max-width: 800px; margin: 0 auto; padding-top: 56.25%; /* 16:9 */ background: var(--navy); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px color-mix(in oklab, var(--navy) 20%, transparent); }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    footer { margin-top: 64px; padding: 20px 0; border-top: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); color: #5c6b7d; font-size: 14px; text-align: center; }
    a:focus-visible { outline: 2px solid var(--steel); outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <a href="/">← OmniHub</a>
      <p class="tool-name">Vulnerable Customer</p>
      <span></span>
    </div>
  </header>
  <main>
    <div class="wrap">
      <p class="kicker">Guidance</p>
      <h1>Vulnerable Customer Explainer</h1>
      <p class="lede">Watch the explainer below for guidance on identifying and supporting vulnerable customers in line with regulatory expectations and best practice.</p>
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/qMyT5hwp8NI" title="Vulnerable Customer Explainer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
  </main>
  <footer>
    <div class="wrap">OmniHub · Internal work tool</div>
  </footer>
</body>
</html>
